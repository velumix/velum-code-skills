name: Skill directory
on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      repository:
        description: Public owner/repository to publish
        required: true
      commit:
        description: Reviewed full commit SHA
        required: true
permissions:
  contents: read
concurrency:
  group: skill-directory-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm test && npm run check
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Validate the approved repository and generate the directory
        run: node scripts/catalog.mjs event
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test && npm run check
      - name: Publish catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entries catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Updated skill directory'
            git push origin HEAD:main
          fi
      - name: Mark submission published
        if: success() && github.event_name == 'issues'
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label published --remove-label needs-fix
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - name: Mark submission for correction
        if: failure() && github.event_name == 'issues'
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-fix --remove-label published
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
